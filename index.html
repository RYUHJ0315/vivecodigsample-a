<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>엄마의 하루</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <main class="app">

    <!-- Header -->
    <header class="header">
      <div>
        <div class="greeting">좋은 아침이에요, 엄마</div>
        <h1 class="title">오늘의 하루</h1>
        <div class="date">8월 19일 수요일</div>
      </div>

      <div class="profile">🌿</div>
    </header>


    <!-- 아이 일정 -->
    <section class="section">

      <div class="section-header">
        <div class="section-title">아이 일정</div>
        <div class="section-subtitle">오늘 3개</div>
      </div>

      <div class="schedule-card">

        <div class="schedule-item">
          <div class="time">15:00</div>

          <div class="timeline"></div>

          <div class="schedule-content">
            <div class="child one">첫째</div>
            <div class="schedule-name">피아노 학원</div>
            <div class="schedule-detail">
              13:00 · 브래뉴음악학원
            </div>
          </div>
        </div>


        <div class="schedule-item">
          <div class="time">16:30</div>

          <div class="timeline"></div>

          <div class="schedule-content">
            <div class="child two">둘째</div>
            <div class="schedule-name">유치원 하원</div>
            <div class="schedule-detail">
              16:30 · 노블킨더 유치원
            </div>
          </div>
        </div>


        <div class="schedule-item">
          <div class="time">18:00</div>

          <div class="timeline"></div>

          <div class="schedule-content">
            <div class="child one">첫째</div>
            <div class="schedule-name">수영</div>
            <div class="schedule-detail">
              16:00 · 동탄복합문화센터
            </div>
          </div>
        </div>

      </div>
    </section>


    <!-- 오늘 챙길 것 -->
    <section class="section">

      <div class="section-header">
        <div class="section-title">오늘 챙길 것</div>
      </div>

      <div class="summary">

        <div class="summary-card">
          <div class="summary-icon">🧺</div>
          <div class="summary-label">집안일</div>
          <div class="summary-main">빨래</div>
          <div class="summary-sub">
            로봇청소기도 필요해요
          </div>
        </div>

        <div class="summary-card">
          <div class="summary-icon">🍚</div>
          <div class="summary-label">오늘 저녁</div>
          <div class="summary-main">김치찌개</div>
          <div class="summary-sub">
            장보기 필요 2가지
          </div>
        </div>

      </div>
    </section>


    <!-- 오늘의 식단 -->
    <section class="section">

      <div class="section-header">
        <div class="section-title">오늘의 식단</div>
      </div>

      <div class="meal-card">

        <div class="meal-left">

          <div class="meal-icon">🍲</div>

          <div>
            <div class="meal-label">저녁</div>
            <div class="meal-name">
              돼지고기 김치찌개
            </div>
          </div>

        </div>

        <div class="meal-note">
          장보기<br />
          두부 · 대파
        </div>

      </div>

    </section>


    <!-- 저장 정보 -->
    <section class="insight">

      <div class="insight-label">오늘 하나만</div>

      <div class="insight-text">
        저장해둔 정보 중<br />
        이번 주말 아이들과 가기 좋은 장소가 있어요.
      </div>

    </section>


    <!-- Bottom navigation -->
    <nav class="bottom-nav">

      <div class="nav-item active">
        <div class="nav-icon">☀️</div>
        오늘
      </div>

      <div class="nav-item">
        <div class="nav-icon">📅</div>
        일정
      </div>

      <div class="nav-item">
        <div class="nav-icon">🧺</div>
        할 일
      </div>

      <div class="nav-item">
        <div class="nav-icon">🍚</div>
        식단
      </div>

    </nav>

  </main>


  <script src="script.js"></script>

</body>
</html>
